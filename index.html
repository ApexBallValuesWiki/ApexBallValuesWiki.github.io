<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Progressive enhancement: the crawlable text snapshot in #root is shown
         only to clients that do NOT run JavaScript (crawlers, no-JS visitors).
         With JavaScript the real app replaces it instantly, so there is no
         flash of a plain-text page. Same HTML is served to everyone. -->
    <script>document.documentElement.classList.add('apex-js')</script>
    <script>
      // Self-Healing SPA: Automatically recover from Vite Chunk/CSS Preload Failures
      (function() {
        function triggerReload() {
          var now = Date.now();
          var lastReload = sessionStorage.getItem('apex-last-reload');
          if (!lastReload || (now - parseInt(lastReload, 10)) > 8000) {
            sessionStorage.setItem('apex-last-reload', now);
            console.warn('Chunk load/preload failure detected. Self-healing reload triggered!');
            window.location.reload();
          }
        }
        window.addEventListener('error', function(e) {
          var msg = e.message || '';
          if (msg.indexOf('Unable to preload CSS') !== -1 || msg.indexOf('Failed to fetch dynamically imported module') !== -1) {
            triggerReload();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason.indexOf('Unable to preload CSS') !== -1 || reason.indexOf('Failed to fetch dynamically imported module') !== -1) {
            triggerReload();
          }
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="Apex WIKI &amp; Values — Ball Tower Defense companion. Unit database, live trade values, and trade calculator." />
    <!-- Site-ownership verification only. This tag loads NOTHING and serves NO
         ads. The AdSense script and ad units are injected dynamically by
         src/utils/ads.js only after approval, consent, host, route and the
         VITE_ADS_ENABLED gate all pass. See ADSENSE-FREE-SETUP.md. -->
    <meta name="google-adsense-account" content="ca-pub-2832011907708910" />
    <title>Apex WIKI &amp; Values — Ball Tower Defense</title>
    <!-- Styles the crawlable HTML snapshot that lives inside #root until the
         app boots. Scoped to .apex-static so it cannot affect the real UI. -->
    <style>
      .apex-static{max-width:820px;margin:0 auto;padding:48px 20px 96px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.75;color:#e9e9f2;background:#0b0b10}
      .apex-static h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:0 0 18px;letter-spacing:-.03em}
      .apex-static h2{font-size:1.25rem;margin:34px 0 10px;letter-spacing:-.01em}
      .apex-static p,.apex-static li{font-size:.96rem;color:#c8c8d8}
      .apex-static ul{padding-left:22px;margin:10px 0}
      .apex-static li{margin:5px 0}
      .apex-static a{color:#8ab4ff;text-underline-offset:3px}
      .apex-static code{background:#1b1b26;padding:1px 5px;border-radius:4px}
      .apex-static nav{border-top:1px solid #2a2a38;margin-top:44px;padding-top:20px}
      .apex-static nav ul{columns:2;column-gap:32px}
      .apex-static .apex-static-note{font-size:.82rem;color:#9292a6;border-top:1px solid #2a2a38;margin-top:30px;padding-top:18px}
      html.apex-js .apex-static{display:none}
      @media (prefers-color-scheme:light){.apex-static{background:#fff;color:#181821}.apex-static p,.apex-static li{color:#3d3d4b}.apex-static nav,.apex-static .apex-static-note{border-color:#dcdce4}.apex-static code{background:#f0f0f5}.apex-static a{color:#1a56c4}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
