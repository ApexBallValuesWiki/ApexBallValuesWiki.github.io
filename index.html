<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Self-Healing SPA: Automatically recover from Vite Chunk/CSS Preload Failures
      (function() {
        function triggerReload() {
          var now = Date.now();
          var lastReload = sessionStorage.getItem('apex-last-reload');
          if (!lastReload || (now - parseInt(lastReload, 10)) > 8000) {
            sessionStorage.setItem('apex-last-reload', now);
            console.warn('Chunk load/preload failure detected. Self-healing reload triggered!');
            window.location.reload();
          }
        }
        window.addEventListener('error', function(e) {
          var msg = e.message || '';
          if (msg.indexOf('Unable to preload CSS') !== -1 || msg.indexOf('Failed to fetch dynamically imported module') !== -1) {
            triggerReload();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason.indexOf('Unable to preload CSS') !== -1 || reason.indexOf('Failed to fetch dynamically imported module') !== -1) {
            triggerReload();
          }
        });
      })();
    </script>
