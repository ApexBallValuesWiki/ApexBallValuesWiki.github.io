# ============================================================================
# CLOUDFLARE WORKERS CONFIGURATION (apex-db)
# ============================================================================
# This is the LIVE database worker that powers the whole site:
#   https://apex-db.apexballtd-admin.workers.dev
#
# Deploy from the CLI:
#   npx wrangler deploy
#
# (The worker was originally deployed by pasting the file into the Cloudflare
# dashboard — Workers & Pages -> apex-db -> Quick edit. CLI deploys with the
# config below target the SAME worker, so both workflows stay in sync.)
# ============================================================================

name = "apex-db"
main = "scripts/cloudflare-proxy-worker.js"
compatibility_date = "2026-07-19"

# ============================================================================
# KV NAMESPACE BINDING (REQUIRED for persistence!)
# The worker expects the binding name "APEX_OVERRIDES". Without it the worker
# silently degrades to per-isolate IN-MEMORY storage and all overrides +
# admin passwords are lost on every cold start.
#
# Create the namespace and let wrangler paste the id back here automatically:
#   npx wrangler kv namespace create APEX_OVERRIDES
#
# Then make sure this block is uncommented with the real id:
# REQUIRED BEFORE DEPLOY: npx wrangler kv namespace create APEX_OVERRIDES
# then uncomment this block and paste the returned id. Without the binding the
# worker silently falls back to per-isolate memory and EDITOR CHANGES ARE LOST.
# [[kv_namespaces]]
# binding = "APEX_OVERRIDES"
# id = "<your-kv-namespace-id>"
#
# If you manage bindings in the dashboard instead (the original deployment
# method), verify: Workers & Pages -> apex-db -> Settings -> Bindings ->
# "APEX_OVERRIDES" -> your KV namespace.
# ============================================================================

# SESSION SECRET (required for short-lived editor sessions).
# Do NOT put the value in this file or in git. Run:
#   npx wrangler secret put APEX_SESSION_SECRET
# The site works without it (legacy passcode fallback), but enabling it means
# the browser never keeps a plaintext passcode. Check /health after deploying.

# ============================================================================
# AUTOMATIC EXIST COUNTS — free-plan cron (5 triggers/account, 1-minute min).
# Every 15 minutes the worker fetches EXIST_FEED_URL (a public JSON/CSV feed)
# or reads a Roblox Open Cloud DataStore, then writes only if a count changed.
# Push-mode publishers (game-side HttpService) do NOT need this cron; without
# a configured source scheduled() is a harmless no-op. 96 polls/day, far below
# the free 1,000 KV writes/day limit.
# ============================================================================
[triggers]
crons = ["*/15 * * * *"]
