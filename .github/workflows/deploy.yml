name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Fail the deploy rather than shipping a broken build.
      - run: npm run lint
      - run: npm test
      # User/org pages repos (OWNER.github.io) serve from the site ROOT, so the
      # build base must be "/" there; project repos serve from /<repo>/.
      - name: Compute Pages base path + site URL
        id: pages
        run: |
          OWNER="${{ github.event.repository.owner.login }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
            # SITE_URL is the ORIGIN only. prerender-core appends
            # VITE_BASE_PATH itself; including the repo here doubled the
            # canonical URL: /Apex-Ball-TD-WIKI/Apex-Ball-TD-WIKI/...
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
          fi
      # Social cards stay gitignored (regenerable artifacts). `npm run build`
      # runs `generate-social-cards` before Vite copies public/ into dist/, so
      # every deploy ships one card per route without committing PNGs to git.
      # Running it twice would double the ~3-minute card render on every push.
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base }}
          VITE_SITE_URL: ${{ steps.pages.outputs.site }}
          VITE_ADS_ENABLED: ${{ vars.VITE_ADS_ENABLED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
